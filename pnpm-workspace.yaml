packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  typescript: npm:@typescript/typescript6@^6.0.2
  typescript7: npm:typescript@^7.0.2
  '@orpc/contract': ^1.15.0
  '@orpc/server': ^1.15.0
  '@orpc/shared': ^1.15.0
  '@orpc/openapi': ^1.15.0
  '@orpc/zod': ^1.15.0
  '@orpc/client': ^1.15.0
  '@orpc/openapi-client': ^1.15.0
  '@orpc/tanstack-query': ^1.15.0
  zod: ^3.25.76
  eslint: ^9.39.1
  '@eslint/js': ^9.39.1
  typescript-eslint: ^8.67.0
  '@types/node': ^24.13.3

overrides:
  'esbuild@<=0.24.2': '>=0.25.0'
  'tar-fs@>=2.0.0 <2.1.4': '>=2.1.4'
  'tar-fs@>=3.0.0 <3.1.1': '>=3.1.1'

minimumReleaseAge: 10080 # 7 days — delay installing versions published more recently than this
minimumReleaseAgeStrict: true # fail install rather than silently falling back to an older version
allowBuilds:
  '@swc/core': true
  argon2: true
  esbuild: true
  msw: true
  protobufjs: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - knip # TODO: remove once knip@6.32.2 clears the 7-day quarantine window (published 2026-08-11T20:34Z)
