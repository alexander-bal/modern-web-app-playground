packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  typescript: npm:@typescript/typescript6@^6.0.2
  typescript7: npm:typescript@^7.0.2
  '@ts-rest/core': ^3.52.1
  zod: ^3.25.76
  eslint: ^9.39.1
  '@eslint/js': ^9.39.1
  typescript-eslint: ^8.67.0
  '@types/node': ^24.10.1

overrides:
  'esbuild@<=0.24.2': '>=0.25.0'
  'tar-fs@>=2.0.0 <2.1.4': '>=2.1.4'
  'tar-fs@>=3.0.0 <3.1.1': '>=3.1.1'

peerDependencyRules:
  allowedVersions:
    '@ts-rest/fastify>fastify': '5'

audit:
  ignore:
    # ts-deepmerge prototype-method-override DoS. No upstream fix exists: every
    # @anatine/zod-openapi release pins ts-deepmerge ^6.0.3, and overriding it to >=8.0.0
    # breaks the boot path — 7.0.0 dropped the default export that zod-openapi imports.
    # generateOpenApi() runs at startup over static ts-rest contracts, so the merge never
    # sees request data. Drop this once zod-openapi moves off ts-deepmerge 6.
    - GHSA-87mf-gv2c-c62c

minimumReleaseAge: 10080 # 7 days — delay installing versions published more recently than this
minimumReleaseAgeStrict: true # fail install rather than silently falling back to an older version
allowBuilds:
  '@swc/core': true
  argon2: true
  esbuild: true
  msw: true
  protobufjs: true

minimumReleaseAgeExclude:
  - knip # TODO: remove once knip@6.32.2 clears the 7-day quarantine window (published 2026-08-11T20:34Z)
